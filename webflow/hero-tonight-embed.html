<style>
  .mtx-kiatpetch-hero{
    --black:#0A0A0A;
    --blue:#1F5BFF;
    --blue-light:#3B74FF;
    --blue-deep:#16234F;
    --off-white:#F3F5F7;
    --grey-400:#9AA5C7;
    --font-display: 'Plus Jakarta Sans', sans-serif;
    --font-body: 'Plus Jakarta Sans', sans-serif;
    --hero-focus:50% 42%;
    position:relative;
    display:flex;
    align-items:center;
    min-height:540px;
    background:var(--black);
    color:var(--off-white);
    font-family:var(--font-body);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .mtx-kiatpetch-hero *{box-sizing:border-box;}

  .mtx-kiatpetch-hero .bg-image{
    position:absolute;inset:0;
    display:block;
    width:100%;height:100%;
    object-fit:cover;
    object-position:var(--hero-focus);
    border:0;
  }

  /* Dark wash so the copy stays legible over the photo, lighter at the top
     where only the badge sits, heaviest behind the meta line and button.
     The blue glows sit above the wash to keep the brand look. */
  .mtx-kiatpetch-hero .scrim{
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse 700px 420px at 85% -10%, rgba(31,91,255,.26), transparent 60%),
      radial-gradient(ellipse 500px 400px at 10% 110%, rgba(31,91,255,.14), transparent 60%),
      linear-gradient(180deg, rgba(10,10,10,.60) 0%, rgba(10,10,10,.78) 45%, rgba(10,10,10,.92) 100%);
    pointer-events:none;
  }

  .mtx-kiatpetch-hero .texture{
    position:absolute;inset:0;
    background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.025) 0 1px, transparent 1px 26px);
    pointer-events:none;
  }

  .mtx-kiatpetch-hero .inner{
    position:relative;
    width:100%;
    max-width:680px;
    margin:0 auto;
    padding:40px 20px 44px;
    text-align:center;
  }

  .mtx-kiatpetch-hero .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:1px solid rgba(31,91,255,.45);
    background:rgba(31,91,255,.10);
    color:#9DB9FF;
    font-family:var(--font-body);
    font-weight:bold;
    font-size:11.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    padding:7px 14px;
    border-radius:999px;
  }
  .mtx-kiatpetch-hero .badge .dot{
    width:7px;height:7px;border-radius:50%;background:var(--blue);
    animation:mtxPulse 1.8s ease-in-out infinite;
  }
  @keyframes mtxPulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  @media (prefers-reduced-motion: reduce){
    .mtx-kiatpetch-hero .badge .dot{animation:none;}
  }

  /* On the narrowest phones the pill wraps to two lines, so the venue is
     dropped there. It still appears in the meta line below. */
  @media (max-width:479px){
    .mtx-kiatpetch-hero .badge-venue{display:none;}
  }

  .mtx-kiatpetch-hero .accent-rule{
    width:44px;height:2px;background:var(--blue-light);
    margin:18px auto 14px;
  }

  .mtx-kiatpetch-hero .headline{
    font-family:var(--font-display);
    font-weight:800;
    letter-spacing:-0.5px;
    font-size:clamp(1.9rem, 7vw, 2.9rem);
    line-height:1.06;
    margin:0 0 12px;
    text-shadow:0 2px 18px rgba(0,0,0,.55);
  }
  .mtx-kiatpetch-hero .tagline{
    font-size:16px;
    line-height:1.5;
    color:var(--blue-light);
    font-weight:bold;
    max-width:54ch;
    margin:0 auto 20px;
  }

  .mtx-kiatpetch-hero .meta{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:8px 22px;
    font-size:13px;
    line-height:1.5;
    letter-spacing:.02em;
    color:var(--grey-400);
    margin:0 0 26px;
  }
  .mtx-kiatpetch-hero .meta-item{
    display:inline-flex;
    align-items:center;
    gap:7px;
    white-space:nowrap;
  }
  .mtx-kiatpetch-hero .meta-icon{
    font-size:13px;
    line-height:1;
  }

  .mtx-kiatpetch-hero .cta{
    display:inline-block;
    background:linear-gradient(135deg, var(--blue-light), var(--blue));
    color:var(--off-white);
    font-family:var(--font-body);
    font-weight:bold;
    font-size:14px;
    letter-spacing:.04em;
    text-transform:uppercase;
    text-decoration:none;
    padding:15px 26px;
    border-radius:6px;
  }
  .mtx-kiatpetch-hero .cta:hover{background:#1442D0;}

  @media (min-width:768px){
    .mtx-kiatpetch-hero{min-height:620px;}
    .mtx-kiatpetch-hero .inner{max-width:780px;padding:56px 20px 60px;}
  }
</style>

<div class="mtx-kiatpetch-hero">
  <!-- Hero photo. Upload the .webp to the Webflow asset library and paste that
       URL into src below. One place to edit. If the URL is missing or fails to
       load, the image hides itself and the hero falls back to the gradient. -->
  <img class="bg-image" id="mtx-hero-image"
       src="PASTE-WEBFLOW-HERO-IMAGE-URL-HERE"
       alt=""
       width="1690" height="900"
       fetchpriority="high" decoding="async"
       onerror="this.style.display='none';">
  <div class="scrim"></div>
  <div class="texture"></div>
  <div class="inner">
    <span class="badge" id="mtx-hero-badge"></span>
    <div class="accent-rule"></div>
    <h1 class="headline" id="mtx-hero-headline"></h1>
    <p class="tagline" id="mtx-hero-tagline"></p>
    <p class="meta">
      <span class="meta-item" id="mtx-hero-meta-date"></span>
      <span class="meta-item" id="mtx-hero-meta-times"></span>
      <span class="meta-item">
        <span class="meta-icon" aria-hidden="true">&#128205;</span>Rajadamnern Stadium, Bangkok
      </span>
    </p>
    <!-- TICKET LINK. The same for every night of the week. This is the only
         place to change it. -->
    <a class="cta" id="mtx-hero-cta" href="#rec3588158203"></a>
  </div>
</div>

<script>
(function () {

  // Day index matches JS Date.getDay(): 0 = Sunday ... 6 = Saturday
  // `supporting` and `close` are not shown in this hero block. They are kept
  // here so later blocks on the page can reuse the same event data.
  // `image` is optional: leave it "" to use the default hero photo in the
  // markup above, or paste a Webflow asset URL to give that night its own shot.
  // There is no ticket link in here. That lives on the button in the markup
  // above and is shared by all seven nights.
  var MTX_HERO_EVENTS = [
    { // 0: Sunday
      name: "Kiatpetch Traditional Muay Thai",
      shortName: "Kiatpetch",
      doors: "5:00 PM",
      fights: "6:00 PM",
      close: "10:00 PM (approx.)",
      tagline: "Two styles of Muay Thai.",
      supporting: "Experience a rare combination of 3-round and traditional 5-round Muay Thai, with technical striking, explosive action, live traditional music and a passionate local crowd that knows the sport.",
      image: ""
    },
    { // 1: Monday
      name: "Rajadamnern Knockout",
      shortName: "Knockout",
      doors: "6:00 PM",
      fights: "7:00 PM",
      close: "9:00-9:30 PM",
      tagline: "Fast, explosive Muay Thai.",
      supporting: "Rajadamnern Knockout brings together skilled fighters, powerful match-ups and the unmistakable energy of Thailand's most iconic Muay Thai arena. From the opening bell, every round delivers speed, precision and raw determination, with the atmosphere building as each fighter pushes for a decisive finish.",
      image: ""
    },
    { // 2: Tuesday
      name: "Rajadamnern Knockout",
      shortName: "Knockout",
      doors: "6:00 PM",
      fights: "7:00 PM",
      close: "9:00-9:30 PM",
      tagline: "Fast, explosive Muay Thai.",
      supporting: "Knockout brings fast, explosive Muay Thai to the heart of Bangkok. Expect 7 sharp three-round bouts, high-pressure action, and the raw energy of Thailand's most historic fight venue. Be there when the first bell rings.",
      image: ""
    },
    { // 3: Wednesday
      name: "New Power Muay Thai",
      shortName: "New Power",
      doors: "5:00 PM",
      fights: "6:00 PM",
      close: "10:00 PM (approx.)",
      tagline: "Raw, authentic Muay Thai.",
      supporting: "Feel the raw power of authentic Muay Thai every Wednesday night at Rajadamnern Stadium. Watch elite local fighters collide over five high-stakes rounds where precision, timing, and relentless control build explosive momentum, driven by the electric roar of Bangkok's most passionate fight crowd, proudly promoted by New Power, one of Thailand's long-established and leading Muay Thai promoters.",
      image: ""
    },
    { // 4: Thursday
      name: "Petchyindee Muay Thai",
      shortName: "Petchyindee",
      doors: "5:00 PM",
      fights: "6:00 PM",
      close: "10:00 PM (approx.)",
      tagline: "Technical, tactical Muay Thai.",
      supporting: "The gold standard for technical stadium Muay Thai. Fighters are hand-picked, with a slower, tactical pace that rewards ring craft over knockouts.",
      image: ""
    },
    { // 5: Friday
      name: "Rajadamnern Knockout",
      shortName: "Knockout",
      doors: "6:00 PM",
      fights: "7:00 PM",
      close: "9:00-9:30 PM",
      tagline: "Fast, explosive Muay Thai.",
      supporting: "The highest energy event of the week. Fast-paced 3-round action where fighters hunt for the KO.",
      image: ""
    },
    { // 6: Saturday
      name: "RWS Rajadamnern World Series",
      shortName: "RWS",
      doors: "6:00 PM",
      fights: "7:10 PM",
      close: "10:00 PM (approx.)",
      tagline: "World-class championship Muay Thai.",
      supporting: "World-class championship Muay Thai. Exclusive Club class and LEO section available.",
      image: ""
    }
  ];

  var DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

  function getBangkokCalendarDate(offsetDays) {
    var fmt = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Bangkok", year: "numeric", month: "numeric", day: "numeric" });
    var parts = fmt.formatToParts(new Date());
    var y, m, d;
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].type === "year") y = parseInt(parts[i].value, 10);
      if (parts[i].type === "month") m = parseInt(parts[i].value, 10);
      if (parts[i].type === "day") d = parseInt(parts[i].value, 10);
    }
    var result = new Date(Date.UTC(y, m - 1, d));
    result.setUTCDate(result.getUTCDate() + offsetDays);
    return result;
  }

  function getBangkokMinutesNow() {
    var fmt = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Bangkok", hour: "2-digit", minute: "2-digit", hour12: false });
    var parts = fmt.formatToParts(new Date());
    var h = 0, m = 0;
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].type === "hour") h = parseInt(parts[i].value, 10);
      if (parts[i].type === "minute") m = parseInt(parts[i].value, 10);
    }
    if (h === 24) h = 0;
    return h * 60 + m;
  }

  function parseClockTimeToMinutes(timeStr) {
    var match = /(\d{1,2}):(\d{2})\s*(AM|PM)/i.exec(timeStr);
    if (!match) return 0;
    var h = parseInt(match[1], 10);
    var m = parseInt(match[2], 10);
    var period = match[3].toUpperCase();
    if (period === "PM" && h !== 12) h += 12;
    if (period === "AM" && h === 12) h = 0;
    return h * 60 + m;
  }

  function renderMtxHero() {
    var todayIndex = getBangkokCalendarDate(0).getUTCDay();
    var minutesNow = getBangkokMinutesNow();
    var tonightsFightMinutes = parseClockTimeToMinutes(MTX_HERO_EVENTS[todayIndex].fights);
    var offset = minutesNow >= tonightsFightMinutes ? 1 : 0;

    var dayIndex = (todayIndex + offset) % 7;
    var ev = MTX_HERO_EVENTS[dayIndex];
    var dayWord = offset === 0 ? "Tonight" : "Tomorrow";
    var dateObj = getBangkokCalendarDate(offset);
    var dayName = DAY_NAMES[dayIndex];

    var fullDate = dayName + " " + dateObj.getUTCDate() + " " +
      MONTH_NAMES[dateObj.getUTCMonth()] + " " + dateObj.getUTCFullYear();

    document.getElementById("mtx-hero-badge").innerHTML =
      '<span class="dot"></span>' + dayWord + " · " + ev.shortName +
      '<span class="badge-venue"> · Rajadamnern Stadium</span>';

    document.getElementById("mtx-hero-headline").textContent =
      ev.name + " Live\u00A0" + dayWord;

    document.getElementById("mtx-hero-tagline").textContent =
      ev.tagline + " One unforgettable " + dayName + " night at Bangkok's most iconic stadium.";

    document.getElementById("mtx-hero-meta-date").innerHTML =
      '<span class="meta-icon" aria-hidden="true">&#128197;</span>' + fullDate;

    document.getElementById("mtx-hero-meta-times").innerHTML =
      '<span class="meta-icon" aria-hidden="true">&#128341;</span>Doors ' + ev.doors +
      " · First Bell " + ev.fights;

    var imgEl = document.getElementById("mtx-hero-image");
    if (imgEl) {
      imgEl.setAttribute("alt", ev.name + " live at Rajadamnern Stadium, Bangkok");
      if (ev.image) {
        imgEl.setAttribute("src", ev.image);
        imgEl.style.display = "";
      }
    }

    // The script only sets the button label. The ticket link is a plain href
    // in the markup above and is the same every night.
    document.getElementById("mtx-hero-cta").textContent =
      "Book " + (offset === 0 ? "Tonight's" : "Tomorrow's") + " Tickets";
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", renderMtxHero);
  } else {
    renderMtxHero();
  }

})();
</script>
