<script>
/* Seat photo sliders. The dots are the only part that needs a script; the
   swipe is native scroll-snap and works without one. */
(function () {
  var sliders = document.querySelectorAll('.mtx-hp [data-mtx-slider]');
  for (var s = 0; s < sliders.length; s++) build(sliders[s]);

  function build(box) {
    var track = box.querySelector('.mtx-hp__shots-track');
    var dots  = box.querySelector('.mtx-hp__shots-dots');
    if (!track || !dots) return;
    var shots = track.querySelectorAll('img');
    if (shots.length < 2) return;   // one photo needs no dots

    for (var i = 0; i < shots.length; i++) {
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-label', 'Photo ' + (i + 1) + ' of ' + shots.length);
      if (i === 0) b.className = 'is-on';
      b.addEventListener('click', go(i));
      dots.appendChild(b);
    }

    function go(i) {
      return function () {
        track.scrollTo({ left: shots[i].offsetLeft - track.offsetLeft, behavior: 'smooth' });
      };
    }

    var waiting = false;
    track.addEventListener('scroll', function () {
      if (waiting) return;
      waiting = true;
      // One update per frame is plenty; scroll fires far more often than that.
      window.requestAnimationFrame(function () {
        waiting = false;
        var at = Math.round(track.scrollLeft / track.clientWidth);
        var buttons = dots.children;
        for (var j = 0; j < buttons.length; j++) {
          buttons[j].className = (j === at) ? 'is-on' : '';
        }
      });
    }, { passive: true });
  }
})();
</script>

<script>
/* Which nights can still be booked?
 *
 * A night comes off this list when its booking closes, not at midnight. The
 * cutoff on each card is the real one from the database: the first bout less
 * events.booking_cutoff_minutes. New Power on 23 September starts at 6:00 PM
 * Bangkok and shuts at 5:30 PM, so from 5:30 PM it is gone from the homepage,
 * rather than sitting there as "Tonight" until midnight offering a ticket
 * nobody can buy.
 *
 * Bangkok is UTC+7 with no daylight saving, ever, which is why the "is it
 * tonight" test is three lines and not a timezone library. The cutoff test
 * needs no timezone at all: both sides are absolute instants.
 *
 * This still does not decide whether a seat class is sold out. The ticket
 * selector reads that from the database and is the only thing allowed to
 * answer it. This only decides whether to show the night at all.
 */
(function () {
  var list = document.querySelector('[data-mtx-week]');
  if (!list) return;

  var SHOW = 5;
  var now = new Date();

  var bkk = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + 7 * 3600000);
  function two(n) { return (n < 10 ? '0' : '') + n; }
  var today = bkk.getFullYear() + '-' + two(bkk.getMonth() + 1) + '-' + two(bkk.getDate());

  var live = [];
  var cards = [].slice.call(list.querySelectorAll('[data-mtx-cutoff]'));
  for (var i = 0; i < cards.length; i++) {
    var shuts = new Date(cards[i].getAttribute('data-mtx-cutoff'));
    // An unparseable date must not silently delete a real night.
    if (!isNaN(shuts) && now >= shuts) {
      cards[i].parentNode.removeChild(cards[i]);
      continue;
    }
    live.push(cards[i]);
  }
  if (!live.length) return;

  for (var j = 0; j < live.length; j++) {
    var card = live[j];
    // nth-child counts what is left, so the five on screen are the five
    // soonest nights still open. This only has to clear any inline state.
    card.style.display = j < SHOW ? '' : 'none';

    var isNow = j === 0 && card.getAttribute('data-mtx-date') === today;
    card.className = 'mtx-hp__night' + (isNow ? ' mtx-hp__night--now' : '');

    var tag = card.querySelector('.mtx-hp__tag');
    if (isNow && !tag) {
      tag = document.createElement('span');
      tag.className = 'mtx-hp__tag';
      tag.textContent = 'Tonight';
      card.insertBefore(tag, card.firstChild);
    } else if (!isNow && tag) {
      tag.parentNode.removeChild(tag);
    }

    // The lifted card carries the solid button; the rest carry the outline.
    var btn = card.querySelector('.mtx-hp__nightcta .mtx-hp__btn');
    if (btn) {
      btn.className = 'mtx-hp__btn ' + (isNow ? 'mtx-hp__btn--blue' : 'mtx-hp__btn--outline');
    }
  }

  function hrefOf(card) {
    var a = card && card.querySelector('.mtx-hp__nightcta a');
    return a && a.getAttribute('href');
  }

  // The hero's second door. It says Tonight only when tonight is still open
  // for booking; otherwise it points at the next night that is.
  var next = live[0];
  var heroBtn = document.querySelector('[data-mtx-tonight]');
  if (heroBtn && hrefOf(next)) {
    heroBtn.setAttribute('href', hrefOf(next));
    heroBtn.textContent =
      next.getAttribute('data-mtx-date') === today ? 'Tonight' : 'Next fight night';
  }

  // This Saturday: the soonest RWS night still open.
  var satBtn = document.querySelector('[data-mtx-saturday]');
  if (satBtn) {
    for (var m = 0; m < live.length; m++) {
      var href = hrefOf(live[m]);
      if (href && href.indexOf('/rws/') === 0) { satBtn.setAttribute('href', href); break; }
    }
  }
})();
</script>
