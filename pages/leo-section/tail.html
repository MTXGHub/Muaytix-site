<script>
/* The three behaviours this page is allowed: anchor jumps, the phone bar and
   the FAQ accordion. Plain JavaScript, nothing loaded from outside. */
(function () {
  var root = document.getElementById('mtx-leo');
  if (root === null) return;
  var target = document.getElementById('mtx-leo-book');
  var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 1. Every Book LEO Tickets button scrolls to the widget on this page. */
  var jumps = root.querySelectorAll('a[href="#mtx-leo-book"]');
  for (var i = 0; i < jumps.length; i++) {
    jumps[i].addEventListener('click', function (e) {
      if (target === null) return;
      e.preventDefault();
      target.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'start' });
    });
  }

  /* 2. The phone bar. On once the guest is below the widget, off again when
     the widget is back in view. CSS keeps it off a screen 768px or wider. */
  var bar = root.querySelector('[data-mtx-leo-bar]');
  if (bar && target) {
    var queued = false;
    var update = function () {
      queued = false;
      var below = target.getBoundingClientRect().bottom < 0;
      bar.className = 'mtx-leo-bar' + (below ? ' is-on' : '');
    };
    var queue = function () {
      if (queued === false) { queued = true; window.requestAnimationFrame(update); }
    };
    window.addEventListener('scroll', queue, { passive: true });
    window.addEventListener('resize', queue);
    update();
  }

  /* 3. The FAQ. Every answer is in the page already; this only shows and
     hides them, and keeps aria-expanded true to what is on screen. */
  var buttons = root.querySelectorAll('.mtx-leo-qbtn');
  for (var j = 0; j < buttons.length; j++) {
    buttons[j].addEventListener('click', function () {
      var open = this.getAttribute('aria-expanded') === 'true';
      var panel = document.getElementById(this.getAttribute('aria-controls'));
      this.setAttribute('aria-expanded', open ? 'false' : 'true');
      if (panel) panel.hidden = open;
      this.parentNode.parentNode.className = 'mtx-leo-qa' + (open ? '' : ' is-open');
    });
  }

  /* 4. The widget's own button says Reserve your tickets. On this page it says
     what the page's other buttons say. The widget writes that label again each
     time the guest changes anything, so this watches for it and puts the
     page's words back; it never touches any other label. */
  var slot = document.getElementById('mtx-leo-book');
  if (slot === null || typeof MutationObserver === 'undefined') return;
  new MutationObserver(function () {
    var b = slot.querySelector('[data-go]');
    if (b === null) return;
    if (b.textContent === 'Reserve your tickets') b.textContent = '@@CTA_LABEL@@';
  }).observe(slot, { childList: true, subtree: true, characterData: true });
})();
</script>
</div>
