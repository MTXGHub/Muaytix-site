
<!-- Document B section 17: only schema that can be populated accurately.
     No Event schema on the homepage, because that would mean asserting
     offers, prices and availability the homepage does not hold. No
     performers, no organiser, no start or end times invented to fill a slot.
     The FAQPage entries below are the six questions visible on the page and
     their approved answers, word for word. The logo and sameAs fields are
     left out because no verified URLs were supplied for them. -->
<script type="application/ld+json">
@@SCHEMA@@
</script>

<script>
/* Which nights can still be booked?
 *
 * A night comes off this list when its booking closes, not at midnight. The
 * cutoff on each card is the real one: the first bout minus
 * events.booking_cutoff_minutes, written as an absolute UTC instant.
 *
 * Bangkok is UTC+7 with no daylight saving, ever, which is why the "is it
 * tonight" test is three lines and not a timezone library. The cutoff test
 * needs no timezone at all: both sides are absolute instants.
 *
 * This never decides whether a seat class is sold out. The ticket selector
 * reads that from the database and is the only thing allowed to answer it.
 */
(function () {
  var list = document.querySelector('[data-mtx-week]');
  if (!list) return;

  var SHOW = 5;
  var now = new Date();
  var bkk = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + 7 * 3600000);
  function two(n) { return (n < 10 ? '0' : '') + n; }
  var today = bkk.getFullYear() + '-' + two(bkk.getMonth() + 1) + '-' + two(bkk.getDate());

  var live = [];
  var cards = [].slice.call(list.querySelectorAll('[data-mtx-cutoff]'));
  for (var i = 0; i < cards.length; i++) {
    var shuts = new Date(cards[i].getAttribute('data-mtx-cutoff'));
    if (!isNaN(shuts) && now >= shuts) { cards[i].parentNode.removeChild(cards[i]); continue; }
    live.push(cards[i]);
  }
  if (!live.length) return;

  for (var j = 0; j < live.length; j++) {
    var card = live[j];
    card.style.display = j < SHOW ? '' : 'none';
    var isNow = j === 0 && card.getAttribute('data-mtx-date') === today;
    /* --lede is what shows a row's description, and it belongs to whatever
       row is now on top, not to the row that was on top when the block was
       built. A row with none of its own (a repeat of an event already
       described higher up the week) simply shows none. */
    var isLede = j === 0 && !!card.querySelector('.mtx-hp__night-desc');
    card.className = 'mtx-hp__night'
      + (isNow ? ' mtx-hp__night--now' : '')
      + (isLede ? ' mtx-hp__night--lede' : '');

    /* The Tonight flag. Built here rather than shipped in the markup, because
       which night is tonight is not knowable when the block is pasted, and a
       flag written into static HTML would be wrong by morning. It goes inside
       the "what" cell, not the row itself, so it never lands in the accent
       column and skews the grid. */
    var what = card.querySelector('.mtx-hp__night-what');
    var tag = card.querySelector('.mtx-hp__tag');
    if (isNow && !tag && what) {
      tag = document.createElement('span');
      tag.className = 'mtx-hp__tag';
      tag.textContent = 'Tonight';
      what.insertBefore(tag, what.firstChild);
    } else if (!isNow && tag) {
      tag.parentNode.removeChild(tag);
    }
    /* Every row's button already carries its own event colour from CSS; it
       needs no class swap between rows. */
  }

  /* The hero's second door, labelled "See Tonight's Fight".
   *
   * It ships pointing at the all-dates calendar, because a date written into
   * a static Tilda block is only right on the day it was built. On 27
   * September the button still went to Saturday 26 September's RWS page, a
   * night already over, because that URL had been baked in at build time.
   *
   * So: repoint it at a dated page only when that night is today AND still
   * bookable. Otherwise it stays on the calendar. A button that says tonight
   * never sends a guest to another night, and it can never send them to a
   * night that has been and gone.
   *
   * The destination is read from the card's own data-mtx-href, not from a
   * button inside the card. A card without a CTA used to leave the hero on
   * whatever was hard-coded in the markup. */
  var heroBtn = document.querySelector('[data-mtx-tonight]');
  if (heroBtn) {
    var firstLive = live[0];
    var tonightHref = firstLive
      && firstLive.getAttribute('data-mtx-date') === today
      && firstLive.getAttribute('data-mtx-href');
    if (tonightHref) heroBtn.setAttribute('href', tonightHref);
  }
})();
</script>
</div>
