<title>Agent Tix Booking Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F6F4F1; --surface:#FFFFFF; --surface-2:#FBFAF8;
  --ink:#14110E; --ink-2:#3A342D; --muted:#6E655C; --line:#E2DDD6; --line-2:#EFEBE5;
  --ok-fg:#136B3B; --ok-bg:#E6F2EA;
  --lim-fg:#8A5200; --lim-bg:#FBF0DE;
  --full-fg:#9C1F1F; --full-bg:#F8E8E8;
  --shut-fg:#645B52; --shut-bg:#EDEAE5;
  --ring:#C4122F;
  --shadow:0 1px 2px rgba(20,17,14,.05), 0 8px 24px rgba(20,17,14,.07);
  --shadow-lg:0 2px 4px rgba(20,17,14,.06), 0 18px 44px rgba(20,17,14,.12);
  --rs:#2FA04A; --cc:#3A86D4; --leo:#D2A62A; --tc:#E8631A;
  --blue:#1f5bff; --blue-on:#1540C9; --blue-ink:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#100E0C; --surface:#1A1714; --surface-2:#211D19;
    --ink:#F5F1EC; --ink-2:#D5CCC2; --muted:#9C9187; --line:#332D27; --line-2:#292420;
    --ok-fg:#6FD199; --ok-bg:#12291C;
    --lim-fg:#E5B064; --lim-bg:#2C2113;
    --full-fg:#EE8C8C; --full-bg:#2E1717;
    --shut-fg:#A79C91; --shut-bg:#252119;
    --ring:#F2547A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
    --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#100E0C; --surface:#1A1714; --surface-2:#211D19;
  --ink:#F5F1EC; --ink-2:#D5CCC2; --muted:#9C9187; --line:#332D27; --line-2:#292420;
  --ok-fg:#6FD199; --ok-bg:#12291C;
  --lim-fg:#E5B064; --lim-bg:#2C2113;
  --full-fg:#EE8C8C; --full-bg:#2E1717;
  --shut-fg:#A79C91; --shut-bg:#252119;
  --ring:#F2547A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.55);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font:400 15px/1.55 Barlow,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:"Barlow Condensed",Barlow,sans-serif;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- review chrome (not part of the widget) ---------- */
.chrome{max-width:1180px;margin:0 auto;padding:22px 20px 6px}
.chrome-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.chrome-title{font-size:13px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 15px;border-radius:999px;font-size:12px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:.15s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
/* numbered step badge */
.num{display:inline-grid;place-items:center;width:20px;height:20px;flex:0 0 auto;border-radius:50%;
  background:var(--blue);color:var(--blue-ink);font-family:Barlow;font-size:11px;font-weight:700;
  line-height:1;font-variant-numeric:tabular-nums}

/* ---------- widget shell ---------- */
.stage{padding:18px 20px 80px}
.mtx{max-width:1120px;margin:0 auto;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow);overflow:hidden;transition:max-width .28s ease}
.stage.is-mobile .mtx{max-width:400px}

/* masthead */
.mast{padding:20px 26px;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.mast-lead{display:block;font-size:12px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.mast-venue{display:block;font-family:"Barlow Condensed";font-weight:800;
  font-size:clamp(26px,3.2vw,36px);line-height:1.02;letter-spacing:.005em}
.mast-city{display:block;font-family:"Barlow Condensed";font-weight:600;
  font-size:clamp(18px,2.2vw,24px);line-height:1.15;color:var(--muted);letter-spacing:.03em}

/* section label */
.sec-label{display:flex;align-items:center;gap:9px;margin:0 0 11px;
  font-size:15px;font-weight:700;letter-spacing:.01em}
.sec-label.gap{margin-top:36px}

/* month buttons */
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:4px}
/* border-width stays 3px on every state so selecting a month shifts nothing */
.mbtn{padding:12px 10px;border:3px solid var(--blue);border-radius:11px;background:var(--blue);
  font-family:"Barlow Condensed";font-size:19px;font-weight:700;letter-spacing:.02em;
  cursor:pointer;transition:.15s;color:var(--blue-ink)}
.mbtn:hover:not(.on){background:var(--blue-on);border-color:var(--blue-on)}
/* chosen month reverses out: white fill, blue border, blue type */
.mbtn.on{background:var(--surface);border-color:var(--blue);color:var(--blue)}

/* which month am I looking at — guards against picking a date in the wrong month */
.month-note{display:flex;align-items:center;gap:11px;margin:0 0 14px;padding:12px 15px;
  border:2px solid var(--blue);border-radius:10px;
  background:color-mix(in srgb, var(--blue) 10%, var(--surface));
  color:var(--ink-2);font-size:14.5px;font-weight:600;line-height:1.25}
.month-note svg{flex:0 0 auto;color:var(--blue)}
.month-note b{font-family:"Barlow Condensed";font-size:20px;font-weight:800;
  letter-spacing:.035em;color:var(--blue);white-space:nowrap}

/* calendar */
.cal{padding:24px 26px 26px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{margin-bottom:6px}
.dow span{text-align:center;font-size:13px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);padding:2px 0}
.day{position:relative;min-height:62px;padding:7px 5px 6px;border:1.5px solid transparent;
  border-radius:11px;background:var(--surface-2);cursor:pointer;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:5px;transition:.15s}
.day:hover:not(:disabled){border-color:var(--line);transform:translateY(-1px)}
.day:disabled{background:transparent;cursor:default}
.day .n{font-family:"Barlow Condensed";font-weight:700;font-size:20px;line-height:1;
  font-variant-numeric:tabular-nums}
.day .tag{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);line-height:1.15;max-width:100%;overflow:hidden}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--evt,var(--muted))}
.day.sel{border-color:var(--ink);background:var(--ink)}
.day.sel .n{color:var(--ground)} .day.sel .tag{color:rgba(255,255,255,.72)}
.day.none .n{color:var(--muted);opacity:.4}
.day.shut .n{color:var(--muted);opacity:.55;text-decoration:line-through}
.stage.is-mobile .day{min-height:54px}
.stage.is-mobile .day .tag{display:none}
.stage.is-mobile .months{grid-template-columns:repeat(2,1fr)}

/* selected event box — white, framed in blue, blue accents */
.band{margin:0 26px;padding:22px 24px;background:var(--surface);color:var(--ink);
  border:2px solid var(--blue);border-radius:14px}
.band-k{font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;
  color:var(--blue);margin-bottom:9px}
.band-h{font-size:clamp(24px,3vw,34px);font-weight:800;line-height:1.06;letter-spacing:.01em}
.band-when{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:12px;font-size:15px;
  font-weight:600;color:var(--ink-2)}
.band-when span{display:inline-flex;align-items:center;gap:7px}
.band-when svg{color:var(--blue);flex:0 0 auto}
.band-d{margin-top:13px;font-size:14.5px;line-height:1.55;color:var(--muted);max-width:66ch}
/* a way back, not a call to action — sized down so it sits under the event detail */
.band-change{margin-top:15px;border:1.5px solid var(--blue);background:var(--surface);color:var(--blue);
  padding:6px 11px;border-radius:7px;font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;cursor:pointer;transition:.15s}
.band-change:hover{background:var(--blue);color:var(--blue-ink)}

/* loading */
.load{padding:56px 26px;text-align:center;color:var(--ink-2);font-size:16px;font-weight:600}
.spin{width:26px;height:26px;margin:0 auto 14px;border:3px solid var(--line);
  border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ticket area */
.tix{padding:24px 26px 30px}
.tix-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 14px;margin-bottom:16px}
.tix-h h3{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:700}
.tix-h em{font-style:normal;font-size:12.5px;color:var(--muted)}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.pill.ok{color:var(--ok-fg);background:var(--ok-bg)}
.pill.lim{color:var(--lim-fg);background:var(--lim-bg)}
.pill.full{color:var(--full-fg);background:var(--full-bg)}
.pill.shut{color:var(--shut-fg);background:var(--shut-bg)}

/* step 3a — the four choices, no detail */
.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pick{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:9px;
  padding:16px 15px 15px 20px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--surface);cursor:pointer;text-align:left;transition:.15s;overflow:hidden}
.pick:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.pick-bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.pick-name{font-family:"Barlow Condensed";font-size:22px;font-weight:700;line-height:1.02}
.pick--off{opacity:.72}
.pick--off:hover{transform:none;box-shadow:none;border-color:var(--line)}

/* step 3b — the one chosen class, framed in its own colour */
.detail{border:2px solid var(--c);border-radius:14px;padding:20px 22px;background:var(--surface)}
.detail-k{font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;
  color:var(--c);margin-bottom:8px}
.detail-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:10px}
.detail-h{font-size:clamp(24px,2.6vw,30px);font-weight:800;line-height:1.05}
.detail-d{font-size:14.5px;line-height:1.55;color:var(--muted);max-width:66ch;margin-bottom:16px}
.detail-change{margin-top:15px;border:1.5px solid var(--c);background:var(--surface);color:var(--c);
  padding:6px 11px;border-radius:7px;font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;cursor:pointer;transition:.15s}
.detail-change:hover{background:var(--c);color:#fff}

.note{padding:12px 13px;border-radius:9px;font-size:13.5px;line-height:1.5;
  background:var(--shut-bg);color:var(--ink-2)}
.note.warn{background:var(--lim-bg);color:var(--lim-fg)}
.note b{font-weight:700}
.ack{display:flex;gap:8px;align-items:flex-start;margin-top:9px;cursor:pointer;font-weight:600}
.ack input{width:16px;height:16px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--ink)}

.fields{display:flex;flex-direction:column;gap:12px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:17px}
.f label{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.f label .num{width:17px;height:17px;font-size:10px}
.sel{position:relative}
.sel:after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;
  border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:translateY(-70%) rotate(45deg);pointer-events:none}
/* one border rule for every state, so no select ever looks different from its neighbour */
.sel select{width:100%;min-height:46px;padding:9px 34px 9px 12px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:600;
  appearance:none;-webkit-appearance:none;cursor:pointer;transition:.15s;outline:none}
.sel select:hover:not(:disabled){border-color:var(--ink-2)}
.sel select:focus-visible{border-color:var(--c,var(--blue));box-shadow:0 0 0 3px color-mix(in srgb, var(--c,var(--blue)) 22%, transparent)}
.sel select:disabled{opacity:.55;cursor:not-allowed;background:var(--surface-2)}

.sums{border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2);overflow:hidden}
.sum{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px}
.sum span{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sum b{font-family:"Barlow Condensed";font-size:20px;font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1}
.sum--total{border-top:1px solid var(--line-2);background:var(--surface)}
.sum--total b{font-size:26px;font-weight:800}

/* sized to the words, not the panel — full width only where the panel is narrow */
.go{min-height:44px;padding:11px 26px;border:0;border-radius:9px;background:var(--ink);
  color:var(--ground);font-family:"Barlow Condensed";font-size:15px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:.15s;
  align-self:flex-start}
.go:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--shadow-lg)}
/* waiting, not broken: an outline that reads as "one more thing to do" */
.go:disabled{background:transparent;color:var(--muted);border:1.5px dashed var(--line);
  cursor:not-allowed;transform:none;box-shadow:none}
@media (max-width:640px){ .go{width:100%;align-self:stretch} }

@media (max-width:860px){ .picker{grid-template-columns:repeat(2,1fr)} }
.stage.is-mobile .picker{grid-template-columns:repeat(2,1fr)}
.stage.is-mobile .pair{grid-template-columns:1fr}
.stage.is-mobile .go{width:100%;align-self:stretch}
@media (max-width:520px){ .pair{grid-template-columns:1fr} }

/* footer strip */
.foot{padding:16px 26px 22px;border-top:1px solid var(--line-2);background:var(--surface-2);
  display:flex;flex-wrap:wrap;gap:8px 22px;font-size:12px;color:var(--muted);font-weight:600}
.foot span{display:inline-flex;align-items:center;gap:6px}

@media (max-width:720px){
  .mast,.cal,.tix,.foot{padding-left:16px;padding-right:16px}
  .band{margin-left:16px;margin-right:16px;padding:18px 16px}
  .detail{padding:18px 16px}
  .day .tag{display:none}
  .day{min-height:54px}
  .months{grid-template-columns:repeat(2,1fr)}
}
</style>

<div class="chrome">
  <div class="chrome-row">
    <div class="chrome-title">Agent Tix &middot; booking flow prototype</div>
    <div class="seg" role="group" aria-label="Preview size">
      <button id="vD" aria-pressed="true">Desktop</button>
      <button id="vM" aria-pressed="false">Mobile</button>
    </div>
  </div>
</div>

<div class="stage" id="stage">
  <div class="mtx">
    <div class="mast">
      <span class="mast-lead">Book Tickets for</span>
      <span class="mast-venue">Rajadamnern Stadium</span>

        Your payment details are encrypted and protected by Stripe&rsquo;s enterprise-level security
      </span>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var SERIES = {
  rk:{name:"Rajadamnern Knockout", s:"19:00", e:"21:00", c:"#B0342E",
      d:"Fast-paced three-round fights, chasing a knockout from the opening bell."},
  np:{name:"New Power Traditional Muay Thai", s:"18:00", e:"22:00", c:"#4A7A3F",
      d:"Classic five-round Muay Thai from Thailand's longest-standing promoter, fuelled by an electric local atmosphere."},
  py:{name:"Petchyindee Traditional Muay Thai", s:"18:00", e:"22:00", c:"#8A5A9E",
      d:"Traditional Muay Thai with technical five-round fights, fuelled by a passionate local crowd."},
  rws:{name:"RWS Rajadamnern World Series", s:"19:10", e:"22:00", c:"#2F6FC4",
      d:"World-class championship Muay Thai meets the energy of a Saturday-night global broadcast."},
  kp:{name:"Kiatpetch Traditional Muay Thai", s:"18:00", e:"22:00", c:"#C08A2E",
      d:"Technical fighters blend fast-paced three-round bouts with classic five-round Muay Thai before a lively Sunday-night local crowd."},
  bk:{name:"All Star Elite Fighter by Buakaw", s:"19:00", e:"21:00", c:"#C4122F",
      d:"Thailand takes on the world across seven three-round bouts, promoted by Muay Thai icon Buakaw."}
};
var SHORT = {rk:"Knockout", np:"New Power", py:"Petchyindee", rws:"RWS", kp:"Kiatpetch", bk:"All Star"};

// `tag` is the strapline on each ticket graphic. Kept for reference; the widget
// does not print it, since the description below the name already says it.
var CLASSES = [
  {code:"ringside", name:"Ringside",    tag:"Closest to the ring",           c:"var(--rs)",  seated:true,
   d:"Reserved seating just metres from the ring, placing you close to every entrance, exchange and celebration.",
   p:{gbp:5700, usd:7700, eur:6700, thb:250000, aud:10900, cny:52000}},
  {code:"club",     name:"Club Class",  tag:"Elevated view of the entire ring", c:"var(--cc)", seated:true,
   d:"Our most popular ticket, offering panoramic views from elevated seating with reserved seats throughout the evening.",
   p:{gbp:4100, usd:5500, eur:4800, thb:180000, aud:7900, cny:38000}},
  {code:"leo",      name:"LEO Section", tag:"Where the atmosphere lives",     c:"var(--leo)", seated:false,
   d:"Elevated seating in Section 10, offering panoramic views and one of the stadium's most energetic atmospheres.",
   p:{gbp:3400, usd:4600, eur:4000, thb:150000, aud:6600, cny:31000}},
  {code:"third",    name:"Third Class", tag:"360 degree view of the action",  c:"var(--tc)",  seated:false,
   d:"Guaranteed seating in the upper terraces, with a panoramic 360-degree view across the ring and stadium.",
   p:{gbp:2300, usd:3100, eur:2700, thb:100000, aud:4400, cny:21000}}
];

var CUR = [["usd","USD $"],["eur","EUR €"],["gbp","GBP £"],["aud","AUD $"],["cny","CNY ¥"],["thb","THB ฿"]];
// The dropdown opens on whichever currency leads the list.
var DEFAULT_CUR = CUR[0][0];
var SYM = {gbp:"£", usd:"$", eur:"€", thb:"฿", aud:"A$", cny:"¥"};
var CLOSED_COPY = "Third Class for this date is currently closed. Third Class is usually opened by the stadium once the other seat classes are full or close to full.";

var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var MONTHS_S = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var PICKABLE = [8,9,10,11];   // Sep–Dec 2026, the agreed scope

/* ---- schedule, generated from the recurring pattern ---- */
function iso(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
function lastMondayOf(y,m){
  var d = new Date(Date.UTC(y, m+1, 0));
  while(d.getUTCDay() !== 1) d.setUTCDate(d.getUTCDate()-1);
  return d.getUTCDate();
}
function eventFor(y,m,d){
  if(iso(y,m,d) === "2026-12-26") return null;           // no fight, Boxing Day
  if(m === 11 && d > 31) return null;
  var dow = new Date(Date.UTC(y,m,d)).getUTCDay();       // 0 Sun .. 6 Sat
  if(dow === 1 && d === lastMondayOf(y,m)) return "bk";
  if(dow === 1 || dow === 2 || dow === 5) return "rk";
  if(dow === 3) return "np";
  if(dow === 4) return "py";
  if(dow === 6) return "rws";
  if(dow === 0) return "kp";
  return null;
}

/* ---- simulated availability, stable per date+class ---- */
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0);}
function statusFor(date, code){
  var h = hash(date+"|"+code) % 100;
  if(code === "third") return h < 74 ? "closed" : (h < 88 ? "limited" : "available");
  if(h < 8)  return "full";
  if(h < 30) return "limited";
  return "available";
}
function seatsTogetherFor(date, code){
  var h = hash(date+"|seats|"+code) % 100;
  return h < 34 ? (2 + (h % 3)) : 10;   // sometimes a small block, usually plenty
}

var state = {y:2026, m:8, date:null, cls:null, qty:{}, cur:{}};

var $ = function(id){return document.getElementById(id);};
var grid = $("grid"), out = $("out"), stage = $("stage"), months = $("months");
var cal = document.querySelector(".cal");

function money(cur, minor){
  var v = minor/100;
  var frac = (minor % 100 === 0) ? 0 : 2;
  return SYM[cur] + v.toLocaleString("en-GB",{minimumFractionDigits:frac, maximumFractionDigits:2});
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* ---------------- month buttons ---------------- */
function renderMonths(){
  months.innerHTML = PICKABLE.map(function(m){
    var on = (m === state.m);
    return '<button class="mbtn'+(on?" on":"")+'" data-m="'+m+'"'+(on?' aria-current="true"':'')+'>'+
           MONTHS_S[m]+' 2026</button>';
  }).join("");
}

months.addEventListener("click", function(e){
  var b = e.target.closest("[data-m]");
  if(!b) return;
  state.m = +b.getAttribute("data-m");
  renderMonths();
  renderCal();
  revealCalendar();
});

// On a narrow screen the dates sit below the fold, so switching month looks
// like nothing happened. Scroll only when the grid is not already fully in
// view, which leaves desktop alone rather than jumping the page for no reason.
function revealCalendar(){
  var g = grid.getBoundingClientRect();
  if(g.top >= 0 && g.bottom <= window.innerHeight) return;
  var head = cal.querySelector(".sec-label.gap") || grid;
  head.scrollIntoView({behavior:"smooth", block:"start"});
}

/* ---------------- calendar ---------------- */
function renderCal(){
  $("monthNote").textContent = MONTHS[state.m].toUpperCase() + " " + state.y;

  var first = new Date(Date.UTC(state.y, state.m, 1)).getUTCDay();
  var lead = (first + 6) % 7;                       // week starts Monday
  var days = new Date(Date.UTC(state.y, state.m+1, 0)).getUTCDate();
  var html = "";
  for(var i=0;i<lead;i++) html += '<button class="day none" disabled></button>';

  for(var d=1; d<=days; d++){
    var key = iso(state.y, state.m, d);
    var ev = eventFor(state.y, state.m, d);
    if(!ev){
      html += '<button class="day shut" disabled title="No fight this night">'+
              '<span class="n">'+d+'</span><span class="tag">No fight</span></button>';
      continue;
    }
    var s = SERIES[ev];
    html += '<button class="day'+(state.date===key?" sel":"")+'" data-d="'+key+'" '+
            'style="--evt:'+s.c+'" aria-label="'+esc(s.name)+', '+DAYS[new Date(Date.UTC(state.y,state.m,d)).getUTCDay()]+' '+d+' '+MONTHS[state.m]+' '+state.y+'">'+
            '<span class="n">'+d+'</span>'+
            '<span class="dot"></span>'+
            '<span class="tag">'+esc(SHORT[ev])+'</span></button>';
  }
  grid.innerHTML = html;
}

grid.addEventListener("click", function(e){
  var b = e.target.closest("[data-d]");
  if(!b) return;
  state.date = b.getAttribute("data-d");
  state.cls = null; state.qty = {}; state.cur = {};
  renderCal();
  loading();
});

/* ---------------- one section at a time ----------------
   Choosing a date hands the screen over to the event, exactly as choosing a
   class then hands it to that class. Only one step is ever on screen. */

function loading(){
  cal.hidden = true;
  out.innerHTML = '<div class="load"><div class="spin"></div>Checking live availability&hellip;</div>';
  out.scrollIntoView({behavior:"smooth", block:"start"});
  // The real check will often be quicker; treat this as a minimum time on
  // screen so the message reads rather than flickers.
  setTimeout(render, 1500);
}

function backToDates(){
  state.date = null; state.cls = null; state.qty = {}; state.cur = {};
  out.innerHTML = "";
  cal.hidden = false;
  renderCal();
  cal.scrollIntoView({behavior:"smooth", block:"start"});
}

function eventOn(key){
  var p = key.split("-"), y = +p[0], m = +p[1]-1, d = +p[2];
  return { y:y, m:m, d:d, code:eventFor(y,m,d), dow:DAYS[new Date(Date.UTC(y,m,d)).getUTCDay()] };
}

function fmt12(t){
  var p = t.split(":"), h = +p[0], mm = p[1];
  var ap = h >= 12 ? "pm" : "am", hh = h % 12 || 12;
  return hh + (mm === "00" ? "" : ":"+mm) + ap;
}

function icon(k){
  var a = 'width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"';
  if(k==="cal")   return '<svg '+a+'><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>';
  if(k==="clock") return '<svg '+a+'><circle cx="8" cy="8" r="6.2"/><path d="M8 4.6V8l2.4 1.4"/></svg>';
  return '<svg '+a+'><path d="M8 14.5s5-4.2 5-8a5 5 0 0 0-10 0c0 3.8 5 8 5 8Z"/><circle cx="8" cy="6.4" r="1.8"/></svg>';
}

function statusMeta(st){
  if(st==="available") return {cls:"ok",   label:"Available"};
  if(st==="limited")   return {cls:"lim",  label:"Limited"};
  if(st==="full")      return {cls:"full", label:"Fully booked"};
  return {cls:"shut", label:"Closed"};
}

function render(){
  var e = eventOn(state.date), s = SERIES[e.code];
  out.innerHTML =
    '<section class="band">'+
      '<div class="band-k">Your fight night</div>'+
      '<h2 class="band-h">'+esc(s.name)+'</h2>'+
      '<div class="band-when">'+
        '<span>'+icon("cal")+esc(e.dow+" "+e.d+" "+MONTHS[e.m]+" "+e.y)+'</span>'+
        '<span>'+icon("clock")+esc(fmt12(s.s)+" \u2013 "+fmt12(s.e))+'</span>'+
        '<span>'+icon("pin")+'Rajadamnern Stadium</span>'+
      '</div>'+
      '<p class="band-d">'+esc(s.d)+'</p>'+
      '<button class="band-change" data-back-date>Change date</button>'+
    '</section>'+
    '<section class="tix">'+ seatStep() +'</section>';
  bind();
}

function seatStep(){
  if(!state.cls){
    return '<div class="tix-h">'+
             '<h3><span class="num">3</span>Select your seat class</h3>'+
           '</div>'+
           '<div class="picker">'+ CLASSES.map(pickButton).join("") +'</div>';
  }
  return '<div class="tix-h"><h3><span class="num">3</span>Your seats</h3></div>'+
         classDetail(byCode(state.cls));
}

/* ---- 3a: the four choices, name and status only ---- */
function pickButton(t){
  var st = statusFor(state.date, t.code);
  var meta = statusMeta(st);
  var live = (st === "available" || st === "limited");
  return '<button class="pick'+(live?"":" pick--off")+'" data-pick="'+t.code+'" style="--c:'+t.c+'">'+
    '<span class="pick-bar"></span>'+
    '<span class="pick-name">'+esc(t.name)+'</span>'+
    '<span class="pill '+meta.cls+'"><i></i>'+meta.label+'</span>'+
  '</button>';
}

/* ---- 3b: the one chosen class ---- */
function classDetail(t){
  var st = statusFor(state.date, t.code);
  var meta = statusMeta(st);
  var live = (st === "available" || st === "limited");
  var cur = state.cur[t.code] || DEFAULT_CUR;
  var body;

  if(st === "closed"){
    body = '<div class="note">'+esc(CLOSED_COPY)+'</div>';
  } else if(st === "full"){
    body = '<div class="note">'+esc(t.name)+' is now officially Fully Booked. '+
           'Click the Change seat class button below to check alternative section availability.</div>';
  } else {
    var seats = t.seated ? seatsTogetherFor(state.date, t.code) : 10;
    body =
      '<div class="fields">'+
        '<div class="pair">'+
          '<div class="f"><label for="q-'+t.code+'"><span class="num">4</span>Number of tickets</label>'+
            '<div class="sel"><select id="q-'+t.code+'" data-q="'+t.code+'">'+
              '<option value="">Select</option>'+ qtyOpts() +
            '</select></div></div>'+
          '<div class="f"><label for="c-'+t.code+'"><span class="num">5</span>Choose your currency</label>'+
            '<div class="sel"><select id="c-'+t.code+'" data-c="'+t.code+'">'+
              CUR.map(function(c){ return '<option value="'+c[0]+'"'+(c[0]===cur?" selected":"")+'>'+c[1]+'</option>'; }).join("")+
            '</select></div></div>'+
        '</div>'+
        '<div data-seat="'+t.code+'" data-max="'+seats+'"></div>'+
        '<div class="sums">'+
          '<div class="sum"><span>Price per ticket</span><b data-unit="'+t.code+'">&mdash;</b></div>'+
          '<div class="sum sum--total"><span>Total</span><b data-total="'+t.code+'">&mdash;</b></div>'+
        '</div>'+
        '<button class="go" data-go="'+t.code+'" disabled>Select number of tickets</button>'+
      '</div>';
  }

  return '<section class="detail" style="--c:'+t.c+'">'+
    '<div class="detail-k">You have chosen</div>'+
    '<div class="detail-top">'+
      '<h3 class="detail-h">'+esc(t.name)+'</h3>'+
      '<span class="pill '+meta.cls+'"><i></i>'+meta.label+'</span>'+
    '</div>'+
    '<p class="detail-d">'+esc(t.d)+'</p>'+
    body+
    '<button class="detail-change" data-back-class>Change seat class</button>'+
  '</section>';
}

function qtyOpts(){
  var o = "";
  for(var i=1;i<=10;i++) o += '<option value="'+i+'">'+i+(i===1?" ticket":" tickets")+'</option>';
  return o;
}

/* ---------------- interaction ---------------- */
function bind(){
  out.addEventListener("click", onClick);
  out.addEventListener("change", onChange);
  if(state.cls) update(state.cls);
}

function onClick(e){
  if(e.target.closest("[data-back-date]")) { backToDates(); return; }

  var pick = e.target.closest("[data-pick]");
  if(pick){
    state.cls = pick.getAttribute("data-pick");
    out.querySelector(".tix").innerHTML = seatStep();
    update(state.cls);
    out.querySelector(".tix").scrollIntoView({behavior:"smooth", block:"nearest"});
    return;
  }

  if(e.target.closest("[data-back-class]")){
    state.cls = null;
    out.querySelector(".tix").innerHTML = seatStep();
    out.querySelector(".tix").scrollIntoView({behavior:"smooth", block:"nearest"});
    return;
  }

  var go = e.target.closest("[data-go]");
  if(go && !go.disabled){
    var t = byCode(go.getAttribute("data-go"));
    var q = state.qty[t.code], cu = state.cur[t.code] || DEFAULT_CUR;
    go.textContent = "Reserving your tickets\u2026";
    go.disabled = true;
    setTimeout(function(){
      alert("Prototype \u2014 no payment is taken.\n\n"+
            t.name+" \u00d7 "+q+"\n"+ money(cu, t.p[cu]*q) +"\n\n"+
            "In the real widget this hands straight over to Stripe.");
      go.disabled = false;
      update(t.code);
    }, 700);
  }
}

function onChange(e){
  var q = e.target.getAttribute("data-q");
  var c = e.target.getAttribute("data-c");
  if(q){ state.qty[q] = e.target.value ? +e.target.value : 0; update(q); }
  if(c){ state.cur[c] = e.target.value; update(c); }
  if(e.target.hasAttribute("data-ack")) update(e.target.getAttribute("data-ack"));
}

function byCode(c){ for(var i=0;i<CLASSES.length;i++) if(CLASSES[i].code===c) return CLASSES[i]; }

function update(code){
  var t = byCode(code);
  var totalEl = out.querySelector('[data-total="'+code+'"]');
  if(!totalEl) return;
  var go = out.querySelector('[data-go="'+code+'"]');
  var seatWrap = out.querySelector('[data-seat="'+code+'"]');
  var qty = state.qty[code] || 0;
  var cur = state.cur[code] || DEFAULT_CUR;

  var unitEl = out.querySelector('[data-unit="'+code+'"]');
  if(unitEl) unitEl.textContent = money(cur, t.p[cur]);
  totalEl.textContent = qty ? money(cur, t.p[cur]*qty) : "\u2014";

  var maxTogether = seatWrap ? +seatWrap.getAttribute("data-max") : 10;
  var needsAck = t.seated && qty > maxTogether;

  if(seatWrap){
    if(needsAck && !seatWrap.dataset.built){
      seatWrap.innerHTML =
        '<div class="note warn"><b>We can seat '+maxTogether+' of your group together.</b> '+
        'The rest will be in the same class, but not side by side.'+
        '<label class="ack"><input type="checkbox" data-ack="'+code+'">'+
        '<span>That&rsquo;s fine &mdash; book anyway</span></label></div>';
      seatWrap.dataset.built = "1";
    } else if(!needsAck){
      seatWrap.innerHTML = "";
      seatWrap.dataset.built = "";
    }
  }

  var ack = out.querySelector('[data-ack="'+code+'"]');
  if(go){
    var blocked = !qty || (needsAck && !(ack && ack.checked));
    go.disabled = blocked;
    go.textContent = !qty ? "Select number of tickets"
                   : blocked ? "Confirm seating above"
                   : "Reserve your tickets";
  }
}

/* ---------------- preview toggle ---------------- */
function setView(mobile){
  stage.classList.toggle("is-mobile", mobile);
  $("vD").setAttribute("aria-pressed", String(!mobile));
  $("vM").setAttribute("aria-pressed", String(mobile));
}
$("vD").addEventListener("click", function(){ setView(false); });
$("vM").addEventListener("click", function(){ setView(true); });

renderMonths();
renderCal();
})();
</script>
